name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: ./tests/run.sh
      # build.sh needs a Developer ID to sign, so only check that everything compiles.
      - name: Compile app
        run: |
          flags=(-O -swift-version 5 -target arm64-apple-macosx14.0)
          xcrun swiftc "${flags[@]}" cli/*.swift -o "$RUNNER_TEMP/sleep-in"
          cd gui
          xcrun swiftc "${flags[@]}" LidSleepPolicy.swift LidAwakeService.swift LidAwakeDaemon.swift -o "$RUNNER_TEMP/SleepInLidDaemon"
          xcrun swiftc "${flags[@]}" LidAwakeService.swift LidAwakeClient.swift -o "$RUNNER_TEMP/SleepInLidClient"
          sparkle="$(./fetch-sparkle.sh)"
          xcrun swiftc "${flags[@]}" -F "$sparkle" -framework Sparkle SleepIn.swift -o "$RUNNER_TEMP/SleepIn"
